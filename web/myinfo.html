<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta name="viewport"
      content="width=device-width,initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Expires" content="0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Cache-control" content="no-cache" />
    <meta http-equiv="Cache" content="no-cache" />
    <title></title>
    <link href="../static/css/theme.css" rel="stylesheet" />
    <link href="../static/js/utils/element-ui/lib/theme-chalk/index.css" rel="stylesheet" />
    <link href="../static/template/css/new.common.css" rel="stylesheet" />
    <link href="../static/template/css/bodybg.css" rel="stylesheet" />
    <link href="../static/template/css/new.dialog.css" rel="stylesheet" />
    <link href="../static/template/css/new.my.css" rel="stylesheet" />
    <!-- 自定义 -->
    <link href="../static/css/mynav.css" rel="stylesheet" />
  </head>
  <body class="blue">
    <div class="container" id="app" v-cloak>
      <!-- 顶部导航 -->
      <div id="toolbar"></div>
      <div id="main" class="main section-setting">
        <div class="clearfix main-inner">
          <!-- 右侧内容区 -->
          <div class="content">
            <div class="clearfix content-inner">
              <div class="content-main">
                <div class="content-main-inner">
                  <div class="pwrap setting-password">
                    <div class="phead">
                      <div class="phead-inner">
                        <div class="phead-inner">
                          <h3 class="ptitle"><span>个人信息</span></h3>
                        </div>
                      </div>
                    </div>
                    <div class="pbody">
                      <div class="formcaption-note">
                        补全个人信息，有助于用户更快速地找到你。
                      </div>
                      <el-form ref="form" :model="form" :rules="rules" class="form" label-width="110px">
                        <el-form-item label="用户昵称：">
                          <el-input v-model="form.nickName" placeholder="请输入用户昵称" type="text" maxlength="16" />
                        </el-form-item>
                        <el-form-item label="真实姓名：" prop="name">
                          <el-input v-model="form.realName" placeholder="请输入真实姓名" type="text" maxlength="16" />
                        </el-form-item>
                        <el-form-item label="手机号码：">
                          {{form.phone}}
                        </el-form-item>
                        <el-form-item label="性别：">
                          <el-radio-group v-model="form.sex">
                            <!-- <el-radio label="-1">未知</el-radio> -->
                            <el-radio label="1">男</el-radio>
                            <el-radio label="2">女</el-radio>
                          </el-radio-group>
                        </el-form-item>
                        <!-- <el-form-item label="邮箱：" prop="email">
                          <el-input v-model="form.email" placeholder="请输入邮箱" type="text" maxlength="50" />
                        </el-form-item> -->

                        <el-form-item>
                          <el-button type="primary" size="medium" @click="submit" style="width: 100%;">提交</el-button>
                        </el-form-item>
                      </el-form>
                    </div>
                    <div class="pfoot">
                      <p><b>-</b></p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- 左侧菜单 -->
          <div id="sidebar"></div>

        </div>
      </div>
      <!-- 底部导航 -->
      <div id="footer"></div>
    </div>
    <script src="../static/js/utils/jquery.min.js"></script>
    <script src="../static/js/utils/vue.min.js"></script>
    <script src="../static/js/utils/element-ui/lib/index.js"></script>
    <script src="../static/js/utils/layer/layer.js"></script>
    <script src="../static/js/utils/basepc.js"></script>
    <script src="../static/js/utils/api.js"></script>
    <script src="../static/js/web/mynav.js"></script>
    <script src="../static/js/web/myinfo.js"></script>
  </body>
</html>
