<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta name="viewport"
      content="width=device-width,initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Expires" content="0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Cache-control" content="no-cache" />
    <meta http-equiv="Cache" content="no-cache" />
    <title></title>
    <link href="../static/css/theme.css" rel="stylesheet" />
    <link href="../static/js/utils/element-ui/lib/theme-chalk/index.css" rel="stylesheet" />
    <link href="../static/template/css/new.common.css" rel="stylesheet" />
    <link href="../static/template/css/bodybg.css" rel="stylesheet" />
    <link href="../static/template/css/new.dialog.css" rel="stylesheet" />
    <link href="../static/template/css/new.my.css" rel="stylesheet" />
    <!-- 自定义 -->
    <link href="../static/css/mynav.css" rel="stylesheet" />
  </head>
  <body class="blue">
    <div class="container" id="app" v-cloak>
      <!-- 顶部导航 -->
      <div id="toolbar"></div>
      <div id="main" class="main section-setting">
        <div class="clearfix main-inner">
          <!-- 右侧内容区 -->
          <div class="content">
            <div class="clearfix content-inner">
              <div class="content-main">
                <div class="content-main-inner">
                  <div class="pwrap setting-userinfo">
                    <div class="phead">
                      <div class="phead-inner">
                        <div class="phead-inner">
                          <h3 class="ptitle"><span>会员自助升级</span></h3>
                        </div>
                      </div>
                    </div>
                    <div class="pbody">
                      <div class="formcaption-note">
                        您当前的会员级别：
                        <b style="color:#FF3300" v-if="userInfo.level==0">新手上路</b>
                        <b style="color:#FF3300" v-else-if="userInfo.level==1">普通会员</b>
                        <b style="color:#FF3300" v-else-if="userInfo.level==2">黄金会员</b>
                        ，目前拥有金币
                        <img src="../static/template/images/coins.gif">
                        <b style="color:#FF3300">{{userInfo.coins||0}}</b>
                      </div>
                      <div class="formcaption-note">
                        <div class="alertmsg">升级至黄金会员，您将能管理上传店铺背景banner图片，可切换使用更多的店铺模板风格，并拥有更多受限栏目的操作权限。</div>
                      </div>
                      <el-form ref="form" :model="form" :rules="rules" class="form" label-width="110px">
                        <el-form-item label="选择级别：" prop="level">
                          <el-select v-model="form.level" placeholder="请选择级别" @change="changeLevel">
                            <el-option :label="item.label" :value="item.value" v-for="(item,i) in vipArr"
                              :key="i"></el-option>
                          </el-select>
                        </el-form-item>
                        <el-form-item label="升级时长：" prop="date">
                          <el-select v-model="form.date" placeholder="请选择升级时长" :disabled="!form.level"
                            @change="changeDate">
                            <el-option :label="item.label" :value="item.value" v-for="(item,i) in timeArr[form.level]"
                              :key="i"></el-option>
                          </el-select>
                        </el-form-item>
                        <el-form-item label="将扣金币：" prop="coins" v-show="form.coins">
                          <el-input prefix-icon="el-icon-coin" v-model="form.coins" type="text" disabled />
                        </el-form-item>
                        <el-form-item>
                          <el-button type="primary" size="medium" @click="updateLevel"
                            style="width: 100%;">确认升级</el-button>
                        </el-form-item>
                      </el-form>
                    </div>
                    <div class="pfoot">
                      <p><b>-</b></p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- 左侧菜单 -->
          <div id="sidebar"></div>

        </div>
      </div>
      <!-- 底部导航 -->
      <div id="footer"></div>
    </div>
    <script src="../static/js/utils/jquery.min.js"></script>
    <script src="../static/js/utils/vue.min.js"></script>
    <script src="../static/js/utils/element-ui/lib/index.js"></script>
    <script src="../static/js/utils/layer/layer.js"></script>
    <script src="../static/js/utils/basepc.js"></script>
    <script src="../static/js/utils/api.js"></script>
    <script src="../static/js/web/mynav.js"></script>
    <script src="../static/js/web/mylevel.js"></script>
  </body>
</html>
