<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta name="viewport"
      content="width=device-width,initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Expires" content="0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Cache-control" content="no-cache" />
    <meta http-equiv="Cache" content="no-cache" />
    <title></title>
    <link href="../static/css/theme.css" rel="stylesheet" />
    <link href="../static/js/utils/element-ui/lib/theme-chalk/index.css" rel="stylesheet" />
    <link href="../static/template/default/css/global.css" rel="stylesheet" />
    <link href="../static/template/default/css/style.css" rel="stylesheet" />
    <link href="../static/template/default/css/post.css" rel="stylesheet" />
    <link href="../static/moban/css/style.css" rel="stylesheet">
    <!-- 自定义 -->
    <link href="../static/css/addpost.css" rel="stylesheet" />
  </head>
  <body class="blue bodybgblue1">
    <div id="app" v-cloak>
      <div class="bartop">
        <div class="barcenter">
          <div class="barleft">
            <ul class="barcity">
              <a href="./index.html">返回首页</a>
            </ul>
          </div>
          <!-- 已登录 -->
          <div class="barright" v-if="info.phone">
            欢迎用户{{info.phone}}！&nbsp;
            <a href="./mine.html" v-if="info.phone">个人中心</a>
            <a href="./mine.html" v-else>登录</a>
            <a @click="logOut" class="quit">退出</a>
          </div>
          <!-- 未登录 -->
          <div class="barright" v-else>
            <ul>
              <a href="./login.html">登录</a>
            </ul>
            <ul class="line"><u></u></ul>
            <ul><a href="./register.html">注册</a></ul>
          </div>

        </div>
      </div>
      <div class="clearfix"></div>
      <div class="mhead">
        <div class="logo">
          <a href="./index.html" target="_blank">
            <img :src="webName.logo" />
          </a>
        </div>
        <div class="font">
          {{form.id?'编辑主题':'发布主题'}}
        </div>
      </div>
      <div class="body1000">
        <div class="clear15"></div>
        <el-form ref="form" :model="form" :rules="rules" class="form" label-width="140px">
          <el-form-item label="所属分类：" prop="type">
            <el-select v-model="form.type" placeholder="请选择">
              <el-option :label="item.label" :value="item.value" v-for="(item,i) in typeArr" :key="i"></el-option>
            </el-select>
          </el-form-item>
          <el-form-item label="有效期：" prop="endDate">
            <el-select v-model="form.endDate" placeholder="请选择">
              <el-option :label="item.label" :value="item.value" v-for="(item,i) in timeArr"
                :key="i"></el-option>
            </el-select>
          </el-form-item>
          <el-form-item label="主题标题：" prop="title">
            <el-input type="text" v-model="form.title" maxlength="50" />
          </el-form-item>
          <el-form-item label="上传图片：" class="is-required">
            <el-row>
              <el-col :span="20">
                <el-form-item label="" prop="img1" ref="img1" class="upimgtxt">
                  <el-upload accept="image/*" :limit="4" :class="{hideUpload:imgArr1.length==4}" multiple
                    action="#" list-type="picture-card" :auto-upload="false" :file-list="imgArr1"
                    :on-change="changeImg1" :on-exceed="maxImg">
                    <i slot="default" class="el-icon-plus"></i>
                    <div slot="file" slot-scope="{file}">
                      <el-image class="spinfoImg" :src="file.url" error="图片已删除"></el-image>
                      <span class="el-upload-list__item-actions">
                        <span class="el-upload-list__item-preview" @click="lookImg(file)"><i
                            class="el-icon-zoom-in"></i></span>
                        <span class="el-upload-list__item-delete" @click="removeImg1(file)"
                          v-if="!form.status"><i class="el-icon-delete"></i></span>
                      </span>
                    </div>
                  </el-upload>
                  <div class="uptips redstar" :class="{uptips2:imgArr1.length==4}">图片最多可上传4张</div>
                </el-form-item>
              </el-col>
            </el-row>
          </el-form-item>
          <el-form-item label="内容详情" prop="content">
            <el-input type="textarea" rows="5" v-model="form.content" resize="none"
              placeholder="请输入"></el-input>
               <!-- maxlength="1000" -->
              <!-- <span>{{form.content.length}}/1000字</span> -->
            <span></span>
          </el-form-item>
          <el-form-item label="联系人姓名：" prop="name">
            <el-input type="text" v-model="form.name" maxlength="30" placeholder="请输入" style="width: 30%;" />
          </el-form-item>
          <el-form-item label="联系人手机号码：" prop="tel">
            <el-input :value="form.tel" type="text" placeholder="请输入" @input="setNumber" maxlength="11" style="width: 30%;" />
          </el-form-item>
          <el-form-item>
            <el-button type="primary" size="medium" @click="upload1">确认发布</el-button>
          </el-form-item>
        </el-form>
        <!-- 浏览图片 -->
        <el-dialog :visible.sync="alertShow" :center="true">
          <div class="imgLookDiv flexct">
            <el-image :src="alertImg" error="图片已删除" class="imgLook"></el-image>
          </div>
        </el-dialog>
      </div>
    </div>
    <div class="clearfix"></div>
    <!-- 底部菜单 -->
    <div id="menu-botom"></div>
    <script src="../static/js/utils/jquery.min.js"></script>
    <script src="../static/js/utils/vue.min.js"></script>
    <script src="../static/js/utils/element-ui/lib/index.js"></script>
    <script src="../static/js/utils/layer/layer.js"></script>
    <script src="../static/js/utils/basepc.js"></script>
    <script src="../static/js/utils/api.js"></script>
    <script src="../static/js/web/nav.js"></script>
    <script src="../static/js/web/addpost.js"></script>
  </body>
</html>
