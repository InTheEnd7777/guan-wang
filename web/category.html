<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <meta name="viewport"
      content="width=device-width,initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <link href="../static/css/theme.css" rel="stylesheet" />
    <link href="../static/css/global.css" rel="stylesheet">
    <link href="../static/moban/css/css2.css" rel="stylesheet">
    <link href="../static/moban/css/all.min.css" rel="stylesheet">
    <link href="../static/moban/css/style.css" rel="stylesheet">
    <link href="../static/css/common.css" rel="stylesheet">
    <!-- 自定义 -->
    <link href="../static/css/category.css" rel="stylesheet">
  </head>
  <body class="blue full bodybgblue1">
    <div id="app" v-cloak>
      <div class="container-fluid">
    

        <div class="row align-items-center py-2 px-lg-5" style="width: 100%;">
          <div class="container-fluid p-0 mb-3">
            <nav class="navbar navbar-expand-lg bg-light navbar-light py-2">
              <a href="./index.html" class="navbar-brand d-none d-lg-block">
                <img :src="webName.logo">
              </a>
              <div class="collapse navbar-collapse justify-content-between px-0 px-lg-5 " id="navbarCollapse" >
                <div class="navbar-nav ml-auto py-0 ">
                  <a href="./index.html" class="nav-item nav-link">首页</a>
                  <a href="./category.html?catid=1" class="nav-item nav-link">网页搭建</a>
                  <a href="./category.html?catid=2" class="nav-item nav-link">软件定制</a>
                  <a href="./category.html?catid=3" class="nav-item nav-link">UI设计</a>
                  <a href="./category.html?catid=4" class="nav-item nav-link">APP研发</a>
                  <a href="./aboutus.html?id=3" class="nav-item nav-link">主题规则</a>
                  <!-- 已登录 -->
                  <div class=" nav-link1" v-if="userInfo.phone">
                    欢迎用户{{userInfo.phone}}！
                    <a href="./mine.html" style="color: red;">个人中心</a>
                    <a class="logout" @click="logOut">退出</a>
                  </div>
                  <!-- 未登录 -->
                  <div class=" nav-link1" v-else>
                    <a href="./login.html">登录</a>
                    &nbsp;&nbsp;&nbsp;&nbsp;
                    <a href="./register.html">注册</a>
                  </div>
                </div>
              </div>
            </nav>
          </div>
        </div>
      </div>
      <!-- 内容区 -->
      <div class="container-fluid py-3">
        <div class="container">
          <div class="location" style="margin-bottom: 30px;">
            当前位置：<a href="./index.html">{{webName.title}}</a> <code> &gt; </code>
            <a :href="'./category.html?catid='+catid">{{tags[catid]}}</a>
          </div>
          <div class="row">
            <div class="col-lg-8">
              <div class="row">
                <div class="col-12">
                  <div class="d-flex align-items-center justify-content-between bg-light py-2 px-4 mb-3">
                    <h3 class="m-0">{{tags[catid]}}主题</h3>
                    <a class="text-secondary font-weight-medium text-decoration-none" :href="'addpost.html?type='+catid"
                      target="_blank">发布{{tags[catid]}}主题</a>
                  </div>
                </div>
                <template v-if="isShow && infoList">
                  <div class="col-lg-6" v-for="(item,i) in infoList" :key="item.id">
                    <div class="position-relative mb-3 box-shadow ">
                      <a :href="'./information.html?id='+item.id">
                        <img class="img-fluid w-100 list-img" :src="item.img[0]||WebErrImg" onerror="imgErr(this)">
                      </a>
                      <div class="overlay position-relative bg-light">
                        <div class="mb-2" style="font-size: 14px;">
                          <!-- <a href="">浙江</a> -->
                          <!-- <span class="px-1">/</span> -->
                          <span>{{item.createTime?.substr(2,8)}}</span>
                        </div>
                        <a class="h4 info-link" :href="'./information.html?id='+item.id">{{item.title}}</a>
                        <p class="m-0 nowrap2" style="height: 24px;">{{item.content}}</p>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
              <!-- 分页 -->
              <div id="pagination" class="pages"></div>
            </div>
            <!-- 主题推荐 -->
            <div class="col-lg-4 pt-3 pt-lg-0">
              <div class="pb-3">
                <div class="bg-light py-2 px-4 mb-3">
                  <h3 class="m-0">主题推荐</h3>
                </div>
                <!-- <div class="ndwrap flexct" v-if="recShow && !recList.length">
                  <img src="../static/img/base/tip.svg" class="ndimg" />
                  <div class="ndtxt">暂无相关记录！</div>
                </div> -->
                <div class="nodata" v-if="recShow && !recList.length">暂无相关记录！</div>
                <div class="d-flex mb-3" v-else-if="recShow && recList.length" v-for="(item,i) in recList"
                  :key="item.id">
                  <a :href="'./information.html?id='+item.id">
                    <img :src="item.img[0]||WebErrImg" onerror="imgErr(this)" class="recli-img">
                  </a>
                  <div class="w-100 d-flex flex-column justify-content-center bg-light px-3" style="height: 100px;">
                    <div class="mb-1" style="font-size: 13px;">
                      <a :href="'./category.html?catid='+item.type">{{tags[item.type]}}</a>
                      <span class="px-1">/</span>
                      <span>[{{item.createTime?.substr(5,5)}}]</span>
                    </div>
                    <a class="h6 m-0" :href="'./information.html?id='+item.id">{{item.title}}</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- 底部菜单 -->
    <div id="menu-botom"></div>
    <script src="../static/js/utils/jquery.min.js"></script>
    <script src="../static/js/utils/vue.min.js"></script>
    <script src="../static/js/utils/layer/layer.js"></script>
    <script src="../static/js/utils/basepc.js"></script>
    <script src="../static/js/utils/api.js"></script>
    <script src="../static/js/utils/pagination/jquery.pagination.min.js"></script>
    <link href="../static/js/utils/pagination/jquery.pagination.css" rel="stylesheet">
    <script src="../static/js/web/nav.js"></script>
    <script src="../static/js/web/category.js"></script>
  </body>

</html>
