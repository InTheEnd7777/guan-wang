<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta name="viewport"
      content="width=device-width,initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Expires" content="0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Cache-control" content="no-cache" />
    <meta http-equiv="Cache" content="no-cache" />
    <title></title>
    <link href="../static/css/theme.css" rel="stylesheet" />
    <link href="../static/js/utils/element-ui/lib/theme-chalk/index.css" rel="stylesheet" />
    <link href="../static/template/css/new.common.css" rel="stylesheet" />
    <link href="../static/template/css/bodybg.css" rel="stylesheet" />
    <link href="../static/template/css/new.dialog.css" rel="stylesheet" />
    <link href="../static/template/css/new.my.css" rel="stylesheet" />
    <!-- 自定义 -->
    <link href="../static/css/mynav.css" rel="stylesheet" />
  </head>
  <body class="blue">
    <div class="container" id="app" v-cloak>
      <!-- 顶部导航 -->
      <div id="toolbar"></div>
      <div id="main" class="main section-setting">
        <div class="clearfix main-inner">
          <!-- 右侧内容区 -->
          <div class="content">
            <div class="clearfix content-inner">
              <div class="content-main">
                <div class="content-main-inner">
                  <div class="pwrap setting-userinfo">
                    <div class="phead">
                      <div class="phead-inner">
                        <div class="phead-inner">
                          <h3 class="ptitle"><span>更换头像</span></h3>
                        </div>
                      </div>
                    </div>
                    <div class="pbody">
                      <div class="formcaption-note">支持上传图片的类型：png，jpg，gif，jpeg</div>
                      <el-form ref="form" :model="form" :rules="rules" label-width="110px">
                        <el-form-item label="上传头像：" class="is-required">
                          <el-row>
                            <el-col :span="5">
                              <el-form-item label="" prop="img1" ref="img1" class="upimgtxt">
                                <el-upload accept="image/*" :limit="1" :class="{hideUpload:imgArr1.length==1}"
                                  action="#" list-type="picture-card" :auto-upload="false" :file-list="imgArr1"
                                  :on-change="changeImg1" class="upimgone">
                                  <i slot="default" class="el-icon-plus"></i>
                                  <div slot="file" slot-scope="{file}">
                                    <el-image class="spinfoImg" :src="file.url" error="图片已删除"></el-image>
                                    <span class="el-upload-list__item-actions">
                                      <span class="el-upload-list__item-preview" @click="lookImg(file)"><i
                                          class="el-icon-zoom-in"></i></span>
                                      <span class="el-upload-list__item-delete" @click="removeImg1(file)"
                                        v-if="!form.status"><i class="el-icon-delete"></i></span>
                                    </span>
                                  </div>
                                </el-upload>
                              </el-form-item>
                            </el-col>
                          </el-row>
                        </el-form-item>
                        <el-form-item>
                          <el-button type="primary" @click.native.prevent="upload1" v-if="!form.status">提交</el-button>
                        </el-form-item>
                      </el-form>
                      <!-- 浏览图片 -->
                      <el-dialog :visible.sync="alertShow" :center="true">
                        <div class="imgLookDiv flexct">
                          <el-image :src="alertImg" error="图片已删除" class="imgLook"></el-image>
                        </div>
                      </el-dialog>
                    </div>
                    <div class="pfoot">
                      <p><b>-</b></p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <!-- 左侧菜单 -->
          <div id="sidebar"></div>
        </div>

      </div>
      <!-- 底部导航 -->
      <div id="footer"></div>
    </div>
    <script src="../static/js/utils/jquery.min.js"></script>
    <script src="../static/js/utils/vue.min.js"></script>
    <script src="../static/js/utils/element-ui/lib/index.js"></script>
    <script src="../static/js/utils/layer/layer.js"></script>
    <script src="../static/js/utils/basepc.js"></script>
    <script src="../static/js/utils/api.js"></script>
    <script src="../static/js/web/mynav.js"></script>
    <script src="../static/js/web/myavatar.js"></script>
  </body>
</html>
