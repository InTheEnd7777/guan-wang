<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta name="viewport"
      content="width=device-width,initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Expires" content="0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Cache-control" content="no-cache" />
    <meta http-equiv="Cache" content="no-cache" />
    <title></title>
    <link href="../static/css/theme.css" rel="stylesheet" />
    <link href="../static/css/global.css" rel="stylesheet" />
    <link href="../static/moban/css/css2.css" rel="stylesheet" />
    <link href="../static/moban/css/all.min.css" rel="stylesheet" />
    <link href="../static/moban/css/style.css" rel="stylesheet" />
    <link href="../static/css/common.css" rel="stylesheet" />
    <link href="../static/js/utils/element-ui/lib/theme-chalk/index.css" rel="stylesheet" />
    <!-- 自定义 -->
    <link href="../static/css/forget.css" rel="stylesheet" />
  </head>
  <body class="blue full bodybgblue1">
    <div id="app" v-cloak>
      <div class="container-fluid">
        <div class="row align-items-center bg-light px-lg-5" style="padding: 10px;">
          <div class="text-truncate col-12 col-md-10">
            <a class="text-secondary top-a" href="./index.html">欢迎访问{{webName.title}}！</a>
          </div>
        </div>
      </div>
      <div class="row align-items-center py-2 px-lg-5" style="width: 100%;">
        <div class="col-lg-4">
          <a href="./index.html" class="navbar-brand d-none d-lg-block">
            <img :src="webName.logo" />
          </a>
        </div>
        <div class="col-lg-8 text-center text-lg-right">
          <img class="img-fluid" :src="webName.headImg" />
        </div>
      </div>
      <div class="container-fluid p-0 mb-3">
        <nav class="navbar navbar-expand-lg bg-light navbar-light py-2 py-lg-0 px-lg-5">
          <div class="collapse navbar-collapse justify-content-between px-0 px-lg-5" id="navbarCollapse">
            <div class="navbar-nav mr-auto py-0" style="margin-left:200px;">
              <a href="./index.html" class="nav-item nav-link">首页</a>
              <a href="./category.html?catid=1" class="nav-item nav-link">网页搭建</a>
              <a href="./category.html?catid=2" class="nav-item nav-link">软件定制</a>
              <a href="./category.html?catid=3" class="nav-item nav-link">UI设计</a>
              <a href="./category.html?catid=4" class="nav-item nav-link">APP研发</a>
              <a href="./aboutus.html?id=3" class="nav-item nav-link">主题规则</a>
            </div>
            <div class="input-group ml-auto" style="width: 100%; max-width: 300px; flex-wrap: nowrap;">
              <input type="text" style="width: 300px;" class="form-control" v-model="keywords" placeholder="搜索" @keyup.enter="search">
              <div class="input-group-append">
                <button class="input-group-text text-secondary" @click="search"><i class="fa fa-search"></i></button>
              </div>
            </div>
          </div>
        </nav>
      </div>
      <div class="inner">
        <div class="body">
          <div class="reg">
            <img :src="webName.loginImg" style="width: 100%;" />
          </div>
          <el-form ref="form" :model="form" :rules="rules" class="login-form">
            <div class="title">忘记密码</div>
            <el-form-item prop="phone">
              <el-input prefix-icon="el-icon-mobile-phone" :value="form.phone" type="text" auto-complete="off"
                placeholder="手机号" @input="setNumber" maxlength="11" />
            </el-form-item>
            <el-form-item prop="msgCode">
              <el-button type="primary" @click="sendMsg" style="float: right;width: 34%;"
                :disabled="form.phone.length!=11||disabled==1">{{sendtxt}}</el-button>
              <el-input prefix-icon="el-icon-message" :value="form.msgCode" auto-complete="off" placeholder="短信验证码"
                style="width: 63%;" @keyup.enter.native="SmsLogin" @input="setNumber2" maxlength="6" />
            </el-form-item>
            <el-form-item prop="newPassword">
              <el-input prefix-icon="el-icon-lock" v-model="form.newPassword" placeholder="请输入新密码" type="password"
                show-password maxlength="16" />
            </el-form-item>
            <el-form-item prop="confirmPassword">
              <el-input prefix-icon="el-icon-lock" v-model="form.confirmPassword" placeholder="请确认新密码" type="password"
                show-password maxlength="16" />
            </el-form-item>
            <el-form-item prop="imgCode" class="codebox">
              <el-input prefix-icon="el-icon-picture-outline" v-model="form.imgCode" type="text" placeholder="图形验证码"
                 @keyup.enter.native="getKey" class="codeinput" maxlength="4">
                <template slot="append">
                  <img :src="form.img" class="codeimg" title="看不清？换一张" @click="getImgCode" />
                </template>
              </el-input>
            </el-form-item>
            <el-form-item>
              <el-button type="primary" size="medium" @click="getKey" style="width: 100%;">提 交</el-button>
              <div class="lgbom">
                <div class="forget" @click="goUrl('./login.html')">登录</div>
                <div class="register" @click="goUrl('./register.html')">免费注册</div>
              </div>
            </el-form-item>
          </el-form>
        </div>
        <div class="clear"></div>
      </div>
    </div>
    <!-- 底部菜单 -->
    <div id="menu-botom"></div>
    <script src="../static/js/utils/jquery.min.js"></script>
    <script src="../static/js/utils/vue.min.js"></script>
    <script src="../static/js/utils/element-ui/lib/index.js"></script>
    <script src="../static/js/utils/layer/layer.js"></script>
    <script src="../static/js/utils/aes.js"></script>
    <script src="../static/js/utils/crypto.js"></script>
    <script src="../static/js/utils/basepc.js"></script>
    <script src="../static/js/utils/api.js"></script>
    <script src="../static/js/web/nav2.js"></script>
    <script src="../static/js/web/forget.js"></script>
  </body>
</html>
